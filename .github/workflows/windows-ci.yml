# Windows CI：构建（Debug + AddressSanitizer）并跑全量用例，另跑基准的分配次数判据与装出来的包消费者。
#
# 这一作业只覆盖 MSVC 一侧；Linux 侧的矩阵、TSan、覆盖率、分发包在 linux-ci.yml。
#
# 不引编译缓存：库加用例总共几十个翻译单元，依赖里只有 Conan 提供的 gtest 预编译包，
# 构建时间不足以摊平缓存工具的安装与还原开销。
#
# MSVC 的 ASan 需要额外处理：Conan 提供的 gtest 没有插桩，容器注解的 ABI 标记会对
# 不上（LNK2038），顶层 CMakeLists 的 ENABLE_SANITIZERS 分支里关掉了这些注解。

name: Windows CI

on:
  # 只在 main 的推送与手动触发上跑：日常开发在 develop 上，免费分钟数有限，
  # 一次全量构建+用例的额度留给合进 main 的提交。要验证某个提交就手动 dispatch。
  push:
    branches: [ main ]
    # 纯文档改动不值得等构建；工作流自身的改动要跑——改坏了得有红灯
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      # Conan 的包缓存搬到仓库内，便于下面的 actions/cache 缓存它
      CONAN_HOME: ${{ github.workspace }}/.conan2

    steps:
      - uses: actions/checkout@v7

      - name: 缓存 Conan 依赖
        uses: actions/cache@v6
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      # 让 cl.exe、ninja 等进入 PATH；windows-latest 上已预装 Visual Studio 与 Ninja
      - uses: ilammy/msvc-dev-cmd@v1

      - name: 安装 Conan
        run: pip install "conan>=2.25"

      - name: 探测 Conan profile
        run: conan profile detect --force

      # gtest 由 conan_provider.cmake 在配置阶段自动安装；sanitizer 在这里显式打开
      - name: 配置（Debug + AddressSanitizer）
        run: cmake --preset debug -DENABLE_SANITIZERS=ON

      # 零告警是本仓库的提交硬判据：构建失败与告警都会让这一步红
      - name: 构建
        run: cmake --build build/debug

      # MSVC 的 ASan 运行库位于 cl.exe 同目录、不在系统 PATH 上：不补这一行，插桩过的
      # 用例会以 0xC0000135（DLL 未找到）启动失败，而报错完全读不出是这个原因
      - name: 全量用例
        run: |
          $env:PATH = "$(Split-Path (Get-Command cl.exe).Source);$env:PATH"
          ctest --test-dir build/debug --output-on-failure --parallel

      - name: 失败时上传用例日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs
          path: build/debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      # 安装包的接线只有仓库外的消费者工程才看得见：库内用例直接从源码树 include，
      # 导出头漏装、cmake 配置包写错、中文注释缺 /utf-8 这些都不会让它们红。
      # 装的是上面那份带 ASan 插桩的构建，所以运行消费者要照 ctest 那一步补同一行 PATH。
      # 这一形状只在 MSVC 侧成立：MSVC 的 ASan 是 DLL 运行期，插桩静态库里那些 __asan_* 外部引用
      # 由 asan DLL 的导入库兜住，补上 PATH 就链得进、跑得动。GCC/Clang 侧走的是静态链接检测运行库，
      # 同样的做法会让普通消费者当场报 undefined reference to `__asan_report_store1'（Linux CI 首跑
      # 实测），那边因此另配一份不带插桩的 Release 树来装。本步验的是「插桩 Debug 包的接线」，
      # Release 交付形态由本地交付门（tools/package-check/run-gate.sh）与 Linux 的 dist 作业覆盖。
      - name: 安装到临时前缀
        run: cmake --install build/debug --prefix "${{ runner.temp }}/ee-install"

      - name: 编译包消费者
        run: |
          # 请求的版本从 CMakeLists 的 project(VERSION) 取，不写死字面量：写死的那份在升版后
          # 与包配置对不上，兼容判定的正面用例就再也不判了（本地交付门与反面脚本同样按这个口径取）
          $eeVersion = (Select-String -Path CMakeLists.txt -Pattern 'project\(ExpressionEngine VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          cmake -S tools/package-check -B tools/package-check/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="${{ runner.temp }}/ee-install" "-DEXPRESSIONENGINE_REQUESTED_VERSION=$eeVersion"
          cmake --build tools/package-check/build

      - name: 运行包消费者
        run: |
          $env:PATH = "$(Split-Path (Get-Command cl.exe).Source);$env:PATH"
          tools/package-check/build/consumerCheck.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 兼容判定的反面用例，与本地交付门跑同一条脚本（两套标准迟早分叉）。它把装出去的包里那份
      # ExpressionEngineConfigVersion.cmake 自称的版本抬到 0.9.0（主次与请求的 0.0.3 不同、且更新），
      # 再让同一个消费者按 0.0.3 配一次：SameMinorVersion 必须拒绝；换成 SameMajorVersion 就会配上，
      # 这一步因此分辨的是策略本身，而不是「请求更高版本会被拒」那种任何策略都通过的写法。
      - name: 包配置兼容判定（反面用例）
        run: bash tools/package-check/compat-refusal-check.sh "${{ runner.temp }}/ee-install"

      # 基准默认不开（EXPRESSIONENGINE_BUILD_BENCHMARKS=OFF），没有任何构建会碰 benchmarks/ 下的代码。
      # 这里单独配置一个 Release 构建目录（基准只在 Release 下有意义，见 benchmarks/CMakeLists.txt），
      # 编译它并跑分配次数判据。耗时不进判据：它随负载变化（README 那张表自己写着 ±5%~20% 抖动），
      # 判一个不可复现的数只会让人学会忽略红灯。判的是 README「解析 + 求值」那八行的分配次数——
      # 整数、同一份语料、两条独立测量路径已经对过账，钉值与语料表在同一个文件里，改标签会当场报
      # 「钉值找不到对应语料」而不是悄悄少判一条。
      - name: 配置基准构建（Release，不构建用例）
        run: cmake --preset release -DEXPRESSIONENGINE_BUILD_TESTS=OFF -DEXPRESSIONENGINE_BUILD_BENCHMARKS=ON

      - name: 编译基准
        run: cmake --build build/release --target ParserBenchmark

      - name: 分配次数判据
        run: build/release/benchmarks/ParserBenchmark.exe --check-allocations
