# Linux CI：把 README 声称的「其它编译器用 -Wall -Wextra -Wpedantic」这条路真正跑起来。
#
# 为什么要单独一个作业：此前只有 MSVC 一侧被验证过，而 GCC 13 下本库其实**编不过**
# （FunctionRegistry.cpp 用了 std::unique_lock 却没 include <mutex>，MSVC 传递包含掩盖了
# 这一点），且自带告警集下有 1058 条诊断。文档写着支持、CI 里没有，就是假承诺。
#
# 矩阵两个编译器：GCC 与 Clang；Debug 档打开 ASan + UBSan。CMake 的非 MSVC 分支带
# -fno-sanitize-recover=all，未定义行为会中止进程，ctest 才真的会红——不加它 UBSan 只打印
# 诊断并继续执行，门禁永远全绿。Clang 钉 20：Clang 18 看不见 libstdc++ 的 std::expected
# （判据与实测见下面那一步的注释）。
#
# 最后两步是安装到临时前缀后编译并运行 tools/package-check：导出头与安装规则的跨平台接线
# 只有在装出来的包上才看得见（/utf-8 只在 MSVC 分支加，Linux 侧靠编译器默认 UTF-8 源码）。
# 装的是不带插桩的 Release 树——插桩静态库链不进普通消费者。

name: Linux CI

on:
  # 与 windows-ci.yml 同一套触发策略：免费分钟数有限，日常在 develop 上，合进 main 才跑。
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  # 样式门：.clang-format 既然随仓库发布，就必须有判据——否则它只是作者本地的偏好，
  # 谁改一行代码都能顺手换一种排版而没人看得见。工具版本钉死：不同 clang-format 大版本
  # 会把同一份文件排成两种形状，不钉版本这道门会在某天全体变红。判据本身复用仓库里的
  # tools/format-check.sh，本地与 CI 走同一条脚本，不会出现「本地过了 CI 红」的两套标准。
  style:
    name: 代码格式（clang-format 23.1.1）
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      # 与下面 Conan 那步同理：镜像的系统 Python 受 PEP 668 保护，只能装进 venv
      - name: 安装钉定版本的 clang-format
        run: |
          python3 -m venv "${RUNNER_TEMP}/format-venv"
          "${RUNNER_TEMP}/format-venv/bin/pip" install "clang-format==23.1.1"

      - name: 检查全部受版本控制的 C++ 文件
        run: CLANG_FORMAT="${RUNNER_TEMP}/format-venv/bin/clang-format" bash tools/format-check.sh

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        compiler: [ gcc, clang ]

    env:
      # Conan 的包缓存搬进工作区，便于下面的 actions/cache 缓存它
      CONAN_HOME: ${{ github.workspace }}/.conan2
      # conan profile detect 认这两个变量，选出的 profile 与矩阵项一致
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang-20' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++-20' }}

    steps:
      - uses: actions/checkout@v7

      # Clang 腿钉 20 而不是镜像默认的 18，原因在上游两边对不上：libstdc++ 把 <expected> 的整段
      # 内容挡在 `__cplusplus > 202002L && __cpp_concepts >= 202002L` 之后（/usr/include/c++/13/
      # expected:34，14 的 bits/version.h:1507 同一道闸），而 Clang 18 只把 __cpp_concepts 报成
      # 201907L——于是 Clang 18 + 任意 libstdc++ 都看不见 std::expected，本库当场编不过（Linux CI
      # 首跑实测：`no template named 'expected' in namespace 'std'`）。Clang 20 报 202002，闸开了。
      # 换 libc++ 也堵不上另一半：libc++ 18 的浮点 from_chars 是删除的（四个调用点报
      # "call to deleted function 'from_chars'"，本机容器实测），所以走「更新的 Clang + libstdc++」。
      # 包在 Ubuntu 自带仓库里就有，不引第三方源；已装则 apt 不动它。
      - name: 安装钉定的 Clang 20
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-20
          clang++-20 --version | head -1

      - name: 缓存 Conan 依赖
        uses: actions/cache@v6
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ matrix.compiler }}-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      # 镜像里的系统 Python 受 PEP 668 保护，直接 pip install 会被拒；建 venv 再装。
      - name: 安装 Conan
        run: |
          python3 -m venv "${RUNNER_TEMP}/conan-venv"
          "${RUNNER_TEMP}/conan-venv/bin/pip" install --upgrade "conan>=2.25"
          echo "${RUNNER_TEMP}/conan-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      # gtest 由 conan_provider.cmake 在配置阶段按需构建（Linux 上没有可复用的预编译包）
      # 关掉模块扫描：本库不用 C++20 模块，而 Ninja + Clang 下 CMake 会去找 clang-scan-deps，
      # 这件工具在 Ubuntu 的打包里换过归属（clang-18 那份不带、llvm-20 才带），缺时 CMake 会把
      # NOTFOUND 原样写进编译规则，配置在 project() 那一步就炸（容器内实测的失败形状：
      # "CMAKE_CXX_COMPILER_CLANG_SCAN_DEPS-NOTFOUND: not found"）。
      - name: 配置（Debug + AddressSanitizer/UndefinedBehaviorSanitizer）
        run: cmake --preset debug -DENABLE_SANITIZERS=ON -DCMAKE_CXX_SCAN_FOR_MODULES=OFF

      # 零告警判据由构建期开关兜住：EXPRESSIONENGINE_WARNINGS_AS_ERRORS 默认 ON，
      # GNU 系下等价 -Werror、MSVC 下等价 /WX，这一步有告警就红。换编译器小版本带来
      # 新的第三方告警时可以显式关掉它，但要在提交说明里写清为什么。
      - name: 构建
        run: cmake --build build/debug

      - name: 全量用例
        run: ctest --test-dir build/debug --output-on-failure --parallel

      # 导出头自洽性：每个公开头单独作为一个翻译单元编一遍。库内的整树构建看不见「这条包含是
      # 别的 TU 凑齐的」，而宿主是从单个头开始的——本库出过一次 std::unique_lock 没带 <mutex>
      # （MSVC 的传递包含掩盖了它）。两个矩阵编译器各跑一遍，告警集与构建一致。
      - name: 导出头自洽性判据
        run: bash tools/header-selfcheck.sh

      - name: 失败时上传用例日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs-${{ matrix.compiler }}
          path: build/debug/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      # 装出去给人用的那份不能带 sanitizer：插桩过的静态库里到处是对 __asan_report_* /
      # __ubsan_handle_*_abort 的外部引用，这些要靠最终可执行体链接时把检测运行时带进来。
      # 仓库外的普通消费者按默认标志链接必然当场报 undefined reference——Linux CI 首跑就是这个形状
      # （普通消费者链上面那份 ASan 树：undefined reference to `__asan_report_store1'）。
      # 上面那份插桩树只负责跑用例；交付形态单独配一份 Release、不开用例（库本身零外部依赖，
      # 因此这一步不经过 Conan），顺带把 GCC/Clang 的 Release 档也纳入构建覆盖。
      # 编译器不在这一步重指：作业级 env 的 CC/CXX 就是矩阵那档，下面 configure 步骤的
      # tools/package-check 也按同一份 env 走——标准库选型必须和被安装的包一致。
      - name: 配置并构建交付形态（Release，不开用例）
        run: |
          cmake -S . -B build/pkg -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF \
            -DEXPRESSIONENGINE_BUILD_TESTS=OFF
          cmake --build build/pkg

      - name: 安装并运行包消费者
        run: |
          cmake --install build/pkg --prefix "${RUNNER_TEMP}/ee-install"
          # 装出来的头按宿主看到的模样再编一遍，并核「受版本控制的公开头都真的进了包」：
          # 安装规则的 PATTERN 或目录写错时会漏装，而消费者只 include 两三个头，看不见漏掉的那一个。
          bash tools/header-selfcheck.sh --prefix "${RUNNER_TEMP}/ee-install"
          cmake -S tools/package-check -B tools/package-check/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/ee-install"
          cmake --build tools/package-check/build
          ./tools/package-check/build/consumerCheck

  # 线程检测器：Expression 的类注释承诺「建好的树可并发只读」，登记表承诺「读写可并发」。
  # 这两条此前只有行为用例（判取值一致），抓不到数据竞争——那要 TSan。
  # 只在 GCC 上跑一份：TSan 与 ASan 互斥（CMake 里直接拒了同时开启），所以必须单独一个构建目录。
  #
  # 说明本机验证到哪一步：库在 g++ 13.3 + -fsanitize=thread 下编译链接均零告警零失败（容器内实测），
  # 但本机容器跑不起 TSan 运行时（WSL2 内核的高位 ASLR 让影子内存映射失败，报
  # "unexpected memory mapping" 后以 66 退出，容器内也无法 setarch -R）。runner 补上了这一段：
  # 首跑（main@7931c32）这一作业绿，即 324 条用例在 halt_on_error=1 下没有竞争报告。
  # 以后这一作业红了，对应的用例与报告都要捞，不要直接关掉它。
  tsan:
    name: 线程检测（ThreadSanitizer）
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      CC: gcc
      CXX: g++
      # TSan 默认只打印报告并继续跑，退出码仍为 0，那样门禁永远不会红——必须让它命中即停
      TSAN_OPTIONS: halt_on_error=1

    steps:
      - uses: actions/checkout@v7

      - name: 缓存 Conan 依赖
        uses: actions/cache@v6
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-gcc-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan
        run: |
          python3 -m venv "${RUNNER_TEMP}/conan-venv"
          "${RUNNER_TEMP}/conan-venv/bin/pip" install --upgrade "conan>=2.25"
          echo "${RUNNER_TEMP}/conan-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      # 单独的构建目录：与上面 build-and-test 的 ASan 档不能共用一份缓存
      - name: 配置（ThreadSanitizer）
        run: cmake -S . -B build/tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=23 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=${{ github.workspace }}/conan_provider.cmake" -DENABLE_THREAD_SANITIZER=ON

      - name: 构建
        run: cmake --build build/tsan

      - name: 全量用例
        run: ctest --test-dir build/tsan --output-on-failure --parallel

      - name: 失败时上传用例日志
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ctest-logs-tsan
          path: build/tsan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # 静态分析门：clang-analyzer + bugprone + performance 三族，配置用仓库根的 .clang-tidy（与本地同一份），
  # 工具版本钉成 pip 的 clang-tidy==22.1.7 —— 与本机验证用的那份是同一个 LLVM 发布号。
  # 判据是「零告警」，豁免只允许就地 NOLINT 或写在 .clang-tidy 里并附理由。
  # 这一作业不装 Conan：tests 关掉后库零外部依赖，配置只是为了拿 compile_commands.json，
  # 把 gtest 的下载与编译拉进来纯属浪费。
  tidy:
    name: 静态分析（clang-tidy 22.1.7）
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: 安装钉定版本的 clang-tidy
        run: |
          python3 -m venv "${RUNNER_TEMP}/tidy-venv"
          "${RUNNER_TEMP}/tidy-venv/bin/pip" install "clang-tidy==22.1.7"

      # 导出不写这一行就没有 compile_commands.json，判据脚本会当场拒绝（本机容器实测过这个失败形状：
      # 配置成功、但没有数据库，脚本以「不存在」变红而不是给出一份空的绿灯）
      - name: 配置（只要编译数据库，不构建用例）
        run: cmake -S . -B build/tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=23 -DCMAKE_CXX_STANDARD_REQUIRED=ON -DCMAKE_CXX_EXTENSIONS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DEXPRESSIONENGINE_BUILD_TESTS=OFF

      - name: 静态分析判据
        run: CLANG_TIDY="${RUNNER_TEMP}/tidy-venv/bin/clang-tidy" bash tools/tidy-check.sh build/tidy

  # 分发包：产出 tar.gz + SHA256SUMS 并自检（版本两处一致、清单与提交逐条相同、校验和可重放、
  # 必需文件点名核对），再把包解开走一遍「配置（不开用例）-> 装包 -> 仓库外消费者」。
  # 全量用例不在这里重复跑：脚本已经证明包内文件清单与 HEAD 的受版本控制清单逐条相同，
  # 而用例由上面的 build-and-test 在同一提交上跑——这一作业因此只需要证明「包自洽且装得出可用产品」。
  dist:
    name: 源码分发包与校验和
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: 产出并自检分发包，再从包里装出可用的包
        run: bash tools/make-dist.sh --check-packaging

      - name: 上传分发包与校验和
        uses: actions/upload-artifact@v7
        with:
          name: source-dist
          path: |
            dist/ExpressionEngine-*.tar.gz
            dist/SHA256SUMS

  # 覆盖率门：README 与 CONTRIBUTING 里「用例覆盖库本体」这句话要有可判定的形式，
  # 否则它只是一句自评。阈值与判据都写死在 tools/coverage.sh 里（本地同一条脚本），
  # 这里只负责提供插桩构建与 gcovr 那件工具。
  #
  # 只在 GCC 上跑一份：gcov 的数据格式是 GNU 系的，Clang 侧要 -fprofile-instr-generate
  # 另一套工具链，而本库的跨平台判据已经由上面的矩阵承担。
  coverage:
    name: 覆盖率（gcov + gcovr）
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      CC: gcc
      CXX: g++

    steps:
      - uses: actions/checkout@v7

      - name: 缓存 Conan 依赖
        uses: actions/cache@v6
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-gcc-${{ hashFiles('conandata.yml', 'conanfile.py') }}

      - name: 安装 Conan
        run: |
          python3 -m venv "${RUNNER_TEMP}/conan-venv"
          "${RUNNER_TEMP}/conan-venv/bin/pip" install --upgrade "conan>=2.25"
          echo "${RUNNER_TEMP}/conan-venv/bin" >> "$GITHUB_PATH"

      - name: 探测 Conan profile
        run: conan profile detect --force

      # 与样式门同理钉工具版本：gcovr 7.x 与 8.x 的开关取值形式不同，脚本会当场拒绝而不是
      # 换一种含义跑下去。装成 venv 是因为镜像的系统 Python 受 PEP 668 保护。
      - name: 安装钉定版本的 gcovr
        run: |
          python3 -m venv "${RUNNER_TEMP}/cov-venv"
          "${RUNNER_TEMP}/cov-venv/bin/pip" install "gcovr==8.6"

      - name: 配置（Debug + gcov 插桩）
        run: cmake --preset debug -DENABLE_COVERAGE=ON

      - name: 构建
        run: cmake --build build/debug

      - name: 全量用例
        run: ctest --test-dir build/debug --output-on-failure --parallel

      - name: 覆盖率判据
        run: GCOVR="${RUNNER_TEMP}/cov-venv/bin/gcovr" bash tools/coverage.sh build/debug

      # 逐文件明细是这条门唯一的现场证据：变红时要能立刻看出是哪一层薄了，
      # 而不是只知道总数没到。
      - name: 上传覆盖率明细
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/debug/coverage.txt
          if-no-files-found: ignore
