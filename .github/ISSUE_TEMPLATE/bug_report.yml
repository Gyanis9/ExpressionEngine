name: 缺陷报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 实际发生了什么、与期望差在哪。请给出表达式或数量文本原文。
      placeholder: |
        表达式：2 mm + 3 s
        期望：按量纲不符报错并指出是哪一侧
        实际：…
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 最小复现
      description: 能编能跑的最小片段（几行即可），以及它在哪条通道给出的结果（tryParse / parse / tryEvaluate / evaluate）。
      render: C++
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境与版本
      description: 编译器与版本、构建档（Debug/Release、是否开 sanitizer）、CMake/Conan 版本、库版本或提交号。
      placeholder: MSVC 14.51 / Debug + ENABLE_SANITIZERS=ON / v0.0.3 或 <提交号>
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你的期望与替代做法
      description: 如果这是设计如此，请说明它给你的集成造成了什么影响。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我用的是当前版本，且已搜过相似 issue
          required: true
        - label: 复现片段不含业务数据或私有信息
          required: true
